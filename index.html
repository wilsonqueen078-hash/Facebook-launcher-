<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f0f2f5;
    }

    h1 {
      color: #1877f2;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Facebook</h1>
  <p>Tap the button below to open Facebook.</p>

  <button onclick="window.location.href='https://www.facebook.com/'">
    Open Facebook
  </button>
</body>
</html>
